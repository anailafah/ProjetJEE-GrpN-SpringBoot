<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ajouter un type d'assurance</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #263247;
        }

        .sidebar {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            width: 240px;
            padding: 28px 18px;
            background: #17243b;
            color: white;
        }

        .brand {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 38px;
        }

        .sidebar a {
            display: block;
            padding: 13px 14px;
            margin: 6px 0;
            color: #dce5f3;
            text-decoration: none;
            border-radius: 7px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #293b59;
            color: white;
        }

        .main {
            margin-left: 240px;
            padding: 35px;
        }

        h1 {
            margin-top: 0;
        }

        .subtitle {
            color: #78849a;
            margin-bottom: 25px;
        }

        .card {
            max-width: 750px;
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(20,35,60,.06);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d8deea;
            border-radius: 6px;
            font-size: 14px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #315caa;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            background: #315caa;
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .btn:hover {
            background: #244987;
        }

        .btn-secondary {
            background: #7c8798;
        }

        .btn-secondary:hover {
            background: #626d7d;
        }

        .message {
            padding: 12px 15px;
            margin-bottom: 18px;
            border-radius: 7px;
            background: #fde8e8;
            color: #a52626;
        }

        @media(max-width:800px) {
            .sidebar {
                position: static;
                width: 100%;
            }

            .main {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Menu latéral -->
    <aside class="sidebar">

        <div class="brand">GestionAssurance</div>

        <a th:href="@{/admin/dashboard}">
            Tableau de bord
        </a>

        <a th:href="@{/utilisateurs}">
            Utilisateurs
        </a>

        <a th:href="@{/admin/roles}">
            Gestion des rôles
        </a>

        <a class="active" th:href="@{/types-assurance}">
            Types d'assurance
        </a>

        <a th:href="@{/contrats}">
            Contrats
        </a>

        <a th:href="@{/sinistres}">
            Sinistres
        </a>

        <a th:href="@{/statistiques}">
            Statistiques
        </a>

        <form th:action="@{/logout}" method="post">
            <button type="submit"
                    style="display:block; width:100%; padding:13px 14px;
                           margin:6px 0; border:none; border-radius:7px;
                           background:transparent; color:#dce5f3;
                           text-align:left; font-size:16px; cursor:pointer;">
                Déconnexion
            </button>
        </form>

    </aside>

    <!-- Contenu principal -->
    <main class="main">

        <h1>Ajouter un type d'assurance</h1>

        <p class="subtitle">
            Renseignez les informations du nouveau type d'assurance.
        </p>

        <!-- Message d'erreur -->
        <div th:if="${error}"
             class="message"
             th:text="${error}">
        </div>

        <!-- Formulaire -->
        <section class="card">

            <form th:action="@{/types-assurance/ajouter}"
                  th:object="${typeAssurance}"
                  method="post">

                <div class="form-group">
                    <label for="nom">Nom du type d'assurance *</label>

                    <input type="text"
                           id="nom"
                           th:field="*{nom}"
                           maxlength="100"
                           placeholder="Ex : Automobile"
                           required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>

                    <textarea id="description"
                              th:field="*{description}"
                              placeholder="Décrivez ce type d'assurance..."></textarea>
                </div>

                <div class="form-group">
                    <label for="dureeMois">Durée (en mois) *</label>

                    <input type="number"
                           id="dureeMois"
                           th:field="*{dureeMois}"
                           min="1"
                           max="1200"
                           placeholder="Ex : 12"
                           required>
                </div>

                <div class="form-group">
                    <label for="tarifBase">Prix de base (€) *</label>

                    <input type="number"
                           id="tarifBase"
                           th:field="*{tarifBase}"
                           min="0.01"
                           step="0.01"
                           placeholder="Ex : 250.00"
                           required>
                </div>

                <div class="buttons">

                    <button type="submit" class="btn">
                        Ajouter le type d'assurance
                    </button>

                    <a th:href="@{/types-assurance}"
                       class="btn btn-secondary">
                        Annuler
                    </a>

                </div>

            </form>

        </section>

    </main>

</body>
</html>
