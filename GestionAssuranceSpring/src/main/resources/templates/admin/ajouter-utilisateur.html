<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un utilisateur</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        h1 {
            color: #263445;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #475569;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        button, .back {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        button {
            background: #2563eb;
            color: white;
        }

        .back {
            background: #64748b;
            color: white;
            margin-left: 8px;
        }

        .specific {
            display: none;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Ajouter un utilisateur</h1>

    <form th:action="@{/utilisateurs/ajouter}" method="post">

        <label for="type">Type d'utilisateur</label>
        <select id="type" name="type" onchange="afficherChamps()" required>
            <option value="">-- Choisir un type --</option>
            <option value="CLIENT">Client</option>
            <option value="AGENT">Agent</option>
            <option value="ADMIN">Administrateur</option>
        </select>

        <label for="nom">Nom</label>
        <input type="text" id="nom" name="nom" required>

        <label for="prenom">Prénom</label>
        <input type="text" id="prenom" name="prenom" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="motDePasse">Mot de passe</label>
        <input type="password" id="motDePasse" name="motDePasse" required>

        <label for="telephone">Téléphone</label>
        <input type="text" id="telephone" name="telephone">

        <div id="clientFields" class="specific">
            <h3>Informations du client</h3>

            <label for="adresse">Adresse</label>
            <input type="text" id="adresse" name="adresse">

            <label for="dateNaissance">Date de naissance</label>
            <input type="date" id="dateNaissance" name="dateNaissance">
        </div>

        <div id="agentFields" class="specific">
            <h3>Informations de l'agent</h3>

            <label for="matricule">Matricule</label>
            <input type="text" id="matricule" name="matricule">

            <label for="service">Service</label>
            <input type="text" id="service" name="service">
        </div>


        <button type="submit">Enregistrer</button>

        <a th:href="@{/utilisateurs}" class="back">Annuler</a>

    </form>

</div>

<script>
    function afficherChamps() {
        const type = document.getElementById("type").value;

        document.getElementById("clientFields").style.display =
            type === "CLIENT" ? "block" : "none";

        document.getElementById("agentFields").style.display =
            type === "AGENT" ? "block" : "none";

        document.getElementById("adminFields").style.display =
            type === "ADMIN" ? "block" : "none";
    }
</script>

</body>
</html>
