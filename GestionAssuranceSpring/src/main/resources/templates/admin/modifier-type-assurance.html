<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type d'assurance</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #f4f6f9;
            color: #333;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #263b5e;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input {
            width: auto;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button, .btn-retour {
            padding: 11px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 15px;
        }

        button {
            background: #263b5e;
            color: white;
        }

        button:hover {
            background: #1b2c47;
        }

        .btn-retour {
            background: #ddd;
            color: #333;
        }

        .btn-retour:hover {
            background: #ccc;
        }
    </style>
</head>

<body>

<div class="container">

    <h1 th:text="${typeAssurance.id == null}
        ? 'Ajouter un type d’assurance'
        : 'Modifier un type d’assurance'">
        Type d’assurance
    </h1>

    <form th:object="${typeAssurance}"
          th:action="${typeAssurance.id == null}
          ? @{/types-assurance/ajouter}
          : @{/types-assurance/modifier/{id}(id=${typeAssurance.id})}"
          method="post">

        <div class="form-group">
            <label for="nom">Nom *</label>
            <input type="text"
                   id="nom"
                   th:field="*{nom}"
                   placeholder="Exemple : Assurance automobile"
                   required>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description"
                      th:field="*{description}"
                      placeholder="Décrivez ce type d’assurance..."></textarea>
        </div>

        <div class="form-group">
            <label for="dureeMois">Durée (en mois)</label>
            <input type="number"
                   id="dureeMois"
                   th:field="*{dureeMois}"
                   min="1"
                   placeholder="Exemple : 12">
        </div>

        <div class="form-group">
            <label for="tarifBase">Tarif de base (€) *</label>
            <input type="number"
                   id="tarifBase"
                   th:field="*{tarifBase}"
                   min="0"
                   step="0.01"
                   required
                   placeholder="Exemple : 150.00">
        </div>

        <div class="form-group checkbox-group">
            <input type="checkbox"
                   id="actif"
                   th:field="*{actif}">
            <label for="actif">Type d’assurance actif</label>
        </div>

        <div class="buttons">
            <button type="submit"
                    th:text="${typeAssurance.id == null}
                    ? 'Ajouter'
                    : 'Enregistrer les modifications'">
                Enregistrer
            </button>

            <a th:href="@{/types-assurance}" class="btn-retour">
                Annuler
            </a>
        </div>

    </form>

</div>

</body>
</html>
