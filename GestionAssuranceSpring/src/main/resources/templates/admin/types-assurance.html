<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des types d'assurance</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #f4f6fb;
            color: #263248;
        }

        .container {
            max-width: 1250px;
            margin: 45px auto;
            padding: 0 25px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            color: #172b4d;
        }

        .header p {
            color: #7b8798;
            margin-top: 7px;
        }

        .btn {
            display: inline-block;
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary {
            background: #3157d5;
            color: white;
        }

        .btn-primary:hover {
            background: #2443ad;
        }

        .btn-edit {
            background: #fff3d6;
            color: #a66a00;
        }

        .btn-detail {
            background: #e6efff;
            color: #3157d5;
        }

        .btn-delete {
            background: #ffe6e6;
            color: #c62828;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .message {
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .success {
            background: #e1f7e9;
            color: #18743a;
        }

        .error {
            background: #ffe6e6;
            color: #b42318;
        }

        .search-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 22px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.04);
        }

        .search-box form {
            display: flex;
            gap: 12px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #dce2ed;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .search-box input:focus {
            border-color: #3157d5;
        }

        .table-card {
            background: white;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.04);
            overflow-x: auto;
        }

        .table-card h2 {
            font-size: 19px;
            margin-bottom: 20px;
            color: #172b4d;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th {
            text-align: left;
            padding: 15px 12px;
            background: #f6f8fc;
            color: #66748a;
            font-size: 13px;
            text-transform: uppercase;
        }

        td {
            padding: 16px 12px;
            border-bottom: 1px solid #edf0f5;
            font-size: 14px;
        }

        tbody tr:hover {
            background: #fafbff;
        }

        .badge {
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-active {
            background: #e1f7e9;
            color: #18743a;
        }

        .badge-inactive {
            background: #ffe6e6;
            color: #b42318;
        }

        .actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .actions .btn {
            padding: 8px 11px;
            font-size: 12px;
        }

        .empty {
            text-align: center;
            padding: 35px;
            color: #8792a5;
        }

        @media (max-width: 700px) {
            .container {
                margin: 25px auto;
                padding: 0 12px;
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
            }

            .search-box form {
                flex-direction: column;
            }

            .header h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- En-tête -->
    <div class="header">
        <div>
            <h1>Types d'assurance</h1>
            <p>Gérez les différentes offres d'assurance proposées par votre établissement.</p>
        </div>

        <a th:href="@{/types-assurance/ajouter}" class="btn btn-primary">
            + Ajouter un type
        </a>
    </div>

    <!-- Messages -->
    <div th:if="${success}" class="message success" th:text="${success}"></div>
    <div th:if="${error}" class="message error" th:text="${error}"></div>

    <!-- Recherche -->
    <div class="search-box">
        <form th:action="@{/types-assurance}" method="get">
            <input type="text"
                   name="recherche"
                   placeholder="Rechercher un type d'assurance...">

            <button type="submit" class="btn btn-primary">
                Rechercher
            </button>
        </form>
    </div>

    <!-- Tableau -->
    <div class="table-card">

        <h2>Liste des types d'assurance</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Description</th>
                    <th>Durée</th>
                    <th>Tarif de base</th>
                    <th>Statut</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="type : ${typesAssurance}">

                    <td th:text="${type.id}"></td>

                    <td th:text="${type.nom}"></td>

                    <td th:text="${type.description != null ? type.description : '-'}"></td>

                    <td th:text="${type.dureeMois != null ? type.dureeMois + ' mois' : '-'}"></td>

                    <td th:text="${type.tarifBase + ' €'}"></td>

                    <td>
                        <span th:if="${type.actif}" class="badge badge-active">
                            Actif
                        </span>

                        <span th:unless="${type.actif}" class="badge badge-inactive">
                            Inactif
                        </span>
                    </td>

                    <td>
                        <div class="actions">

                            <a th:href="@{/types-assurance/{id}(id=${type.id})}"
                               class="btn btn-detail">
                                Détails
                            </a>

                            <a th:href="@{/types-assurance/modifier/{id}(id=${type.id})}"
                               class="btn btn-edit">
                                Modifier
                            </a>

                            <form th:action="@{/types-assurance/supprimer/{id}(id=${type.id})}"
                                  method="post"
                                  onsubmit="return confirm('Voulez-vous vraiment supprimer ce type d’assurance ?');">

                                <button type="submit" class="btn btn-delete">
                                    Supprimer
                                </button>

                            </form>

                        </div>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(typesAssurance)}">
                    <td colspan="7" class="empty">
                        Aucun type d'assurance enregistré.
                    </td>
                </tr>

            </tbody>
        </table>

    </div>

</div>

</body>
</html>
